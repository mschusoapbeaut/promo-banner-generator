<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Promotion Banner Generator</title>

<style>
  :root{
    --navy:oklch(0.30 0.05 250); --gold:#D4AF37; --green:#2E8B57; --red:#C41E3A;
    --cream:oklch(0.975 0.012 85); --bg:oklch(0.99 0.002 80); --card:#ffffff; --line:oklch(0.90 0.01 80); --muted:oklch(0.50 0.02 250); --ink:oklch(0.20 0.03 250);
    --radius:14px; --shadow:0 4px 16px rgba(27,54,93,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter","Noto Sans TC",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}
  .wrap{max-width:900px;margin:0 auto;padding:26px 20px 90px}
  h1.title{font-size:30px;font-weight:800;color:var(--navy);margin:0}
  .subtitle{color:var(--muted);font-size:15px;margin:4px 0 0}
  /* stepper */
  .stepper{display:flex;align-items:flex-start;justify-content:center;gap:0;margin:26px 0 22px}
  .stp{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;cursor:pointer}
  .stp .dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:#e9e2d4;color:var(--muted);transition:.15s}
  .stp.active .dot{background:var(--navy);color:#fff;transform:scale(1.1)}
  .stp.done .dot{background:rgba(27,54,93,.82);color:#fff}
  .stp .lbl{font-size:12px;color:var(--muted);font-weight:600}
  .stp.active .lbl{color:var(--navy)}
  .conn{height:2px;background:#e7e0d3;flex:1;margin-top:17px;min-width:14px;max-width:70px}
  /* card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px}
  .step-title{font-size:20px;font-weight:800;color:var(--navy);margin:0 0 3px}
  .step-desc{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.45}
  label.f{display:block;font-size:13px;font-weight:700;color:var(--ink);margin:14px 0 5px}
  input[type=text],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
  input:focus,select:focus{outline:none;border-color:var(--navy)}
  .hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
  .sep{height:1px;background:var(--line);margin:20px 0}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;padding:9px 15px;font-size:14px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:#12233e}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed}
  .btn-gold{background:var(--gold);color:#3a2f10}.btn-gold:hover{filter:brightness(1.05)}
  .btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn-ghost:hover{background:#f2ede3}
  .btn-danger{background:#fff;color:var(--red);border:1px solid #eaccc6}.btn-danger:hover{background:#fbeeeb}
  .mini{padding:6px 10px;font-size:12px;border-radius:8px}
  .themegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .theme{border:2px solid var(--line);border-radius:12px;padding:20px 8px;text-align:center;cursor:pointer;background:#fff;transition:.15s}
  .theme:hover{border-color:var(--gold)}
  .theme.sel{border-color:var(--navy);background:rgba(27,54,93,.05);box-shadow:var(--shadow)}
  .theme .em{font-size:30px}.theme .nm{font-size:15px;font-weight:700;margin-top:6px}.theme .zh{font-size:12px;color:var(--muted);margin-top:1px}
  .navrow{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
  .badge{background:var(--navy);color:#fff;font-size:11px;font-weight:800;border-radius:20px;padding:3px 10px;letter-spacing:.4px}
  .badge.amber{background:#f4e7c4;color:#8a6d15}.badge.gray{background:#eceae5;color:#888}.badge.green{background:#e4f1e9;color:var(--green)}
  .tier{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px;background:#fff}
  .tier.hid{opacity:.55}
  .tier-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .gift{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:var(--cream)}
  .gift.hid{opacity:.5}
  .gift-h{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .gift-h .gt{font-size:13px;font-weight:700;color:var(--navy);flex:1}
  .prow{display:flex;align-items:center;gap:9px}
  .prow img{width:40px;height:40px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px}
  .prow .pi{flex:1;min-width:0}.prow .pi .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prow .pi .z{font-size:12px;color:var(--muted)}
  .pickwrap{position:relative;margin-top:7px}
  .picklist{position:absolute;z-index:40;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:260px;overflow-y:auto;box-shadow:var(--shadow);display:none}
  .picklist.open{display:block}
  .pi2{display:flex;align-items:center;gap:9px;padding:7px 10px;cursor:pointer;border-bottom:1px solid #f2ede2}
  .pi2:hover{background:var(--cream)}.pi2 img{width:30px;height:30px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:5px}
  .pi2 .n{font-size:13px;font-weight:600}.pi2 .m{font-size:12px;color:var(--muted)}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:7px}
  .cell{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .cell .k{font-size:11px;color:var(--muted)}.cell .v{font-size:13px;font-weight:700;color:var(--navy)}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;background:#fff}
  .drop:hover{border-color:var(--gold);background:#fffdf6}
  .thumbrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .bgthumb{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer}
  .bgthumb img{display:block;object-fit:cover}
  .bgthumb.desktop img{width:104px;height:58px}.bgthumb.mobile img{width:44px;height:78px}
  .bgthumb .del{position:absolute;top:2px;right:2px;background:rgba(180,60,45,.92);color:#fff;border:none;border-radius:5px;font-size:10px;padding:1px 5px;cursor:pointer}
  .bgthumb.sel{outline:3px solid var(--navy)}
  .saved{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .savedcard{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:96px;display:flex;flex-direction:column;gap:6px}
  .savedcard .nm{font-weight:700;font-size:14px;color:var(--navy)}
  .savedcard .mt{font-size:11px;color:var(--muted)}
  .savedcard.empty{align-items:center;justify-content:center;color:var(--muted);font-size:12px}
  .summary{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .warn{font-size:12px;color:#b06a12}
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .gcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px}
  .gcard img{width:100%;border-radius:6px;display:block;cursor:pointer}
  .gcard .cap{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
  .gcard .cap .t{font-size:12px;font-weight:700;color:var(--navy)}
  .seg{display:inline-flex;background:#eee7d9;border-radius:10px;padding:3px;gap:2px}
  .seg button{background:transparent;color:var(--navy);padding:7px 12px;font-size:13px}
  .seg button.on{background:#fff;box-shadow:var(--shadow)}
  /* dialog */
  .overlay{position:fixed;inset:0;background:rgba(20,30,45,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
  .overlay.open{display:flex}
  .dialog{background:#fff;border-radius:14px;max-width:95vw;max-height:95vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .dialog .dh{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .dialog .db{padding:16px;overflow:auto;display:flex;justify-content:center;background:#f6f2ea}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:99;opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .topbar .acts{display:flex;gap:7px}
</style>
</head>

<!-- ===== PASSWORD GATE ===== To change the password, edit GATE_PASSWORD below. -->
<div id="gate" style="position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#1B365D 0%,#24466f 100%);display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif">
  <div style="background:#fff;border-radius:16px;padding:34px 30px;max-width:340px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div style="width:70px;height:70px;margin:0 auto 14px;border-radius:50%;background:#1B365D;display:flex;align-items:center;justify-content:center;font-size:30px">🔒</div>
    <div style="font-size:19px;font-weight:800;color:#1B365D">Promotion Banner Generator</div>
    <div style="font-size:13px;color:#6b7280;margin:4px 0 18px">Enter the team password to continue</div>
    <input id="gatePw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')gateCheck()" style="width:100%;padding:11px 12px;border:1px solid #e7e0d3;border-radius:9px;font-size:15px;box-sizing:border-box;text-align:center"/>
    <div id="gateErr" style="color:#C41E3A;font-size:12px;height:16px;margin-top:6px"></div>
    <button onclick="gateCheck()" style="width:100%;margin-top:8px;background:#1B365D;color:#fff;border:none;border-radius:9px;padding:11px;font-size:15px;font-weight:700;cursor:pointer">Unlock</button>
  </div>
</div>
<script>
  const GATE_PASSWORD = "9999";   /* <-- change this to set your team password */
  function gateOpen(){ const g=document.getElementById('gate'); if(g){g.style.display='none';} try{sessionStorage.setItem('mschu_gate','1');}catch(e){} }
  function gateCheck(){ const v=document.getElementById('gatePw').value; if(v===GATE_PASSWORD){gateOpen();} else {document.getElementById('gateErr').textContent='Incorrect password';document.getElementById('gatePw').value='';} }
  try{ if(sessionStorage.getItem('mschu_gate')==='1'){ var g=document.getElementById('gate'); if(g)g.style.display='none'; } }catch(e){}
  window.addEventListener('DOMContentLoaded',()=>{ const i=document.getElementById('gatePw'); if(i&&document.getElementById('gate').style.display!=='none')i.focus(); });
</script>
<div class="wrap">
  <div class="topbar">
    <div><h1 class="title">Promotion Banner Generator</h1><div class="subtitle">Create branded promotion banners for Ms. Chu Soap &amp; Beaut</div></div>
    <div class="acts">
      <button class="btn-ghost mini" onclick="saveJSON()">💾 Export JSON</button>
      <button class="btn-ghost mini" onclick="document.getElementById('loadfile').click()">📂 Import</button>
      <input type="file" id="loadfile" accept="application/json" style="display:none" onchange="loadJSON(event)">
    </div>
  </div>

  <div class="stepper" id="stepper"></div>
  <div class="card"><div id="stepContent"></div>
    <div class="navrow">
      <button class="btn-ghost" id="btnBack" onclick="go(step-1)">← Back</button>
      <span style="font-size:13px;color:var(--muted)" id="stepOf">Step 1 of 6</span>
      <button class="btn-primary" id="btnNext" onclick="go(step+1)">Next →</button>
    </div>
  </div>
</div>

<!-- PREVIEW DIALOG -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeDialog()">
  <div class="dialog">
    <div class="dh">
      <div class="seg" id="dFmt">
        <button data-f="desktop" class="on" onclick="dSetFmt('desktop')">🖥 Desktop</button>
        <button data-f="mobile" onclick="dSetFmt('mobile')">📱 Mobile</button>
        <button data-f="hero" onclick="dSetFmt('hero')">🎬 Hero</button>
      </div>
      <div class="seg" id="dLang">
        <button data-l="en" class="on" onclick="dSetLang('en')">EN</button>
        <button data-l="zh" onclick="dSetLang('zh')">繁中</button>
      </div>
      <div style="display:flex;gap:7px">
        <button class="btn-gold mini" onclick="dExport()">⬇︎ Download PNG</button>
        <button class="btn-ghost mini" onclick="closeDialog()">✕ Close</button>
      </div>
    </div>
    <div class="db"><div id="dScaler" style="transform-origin:top center"><div id="dHost"></div></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

    {id:"1",amount:500,gifts:[],hidden:false},

    {id:"3",amount:1000,gifts:[newGift("Healing Night Cream",15)],hidden:false}
  ]
};}
function uid(){return 'g'+Math.random().toString(36).slice(2,8)}
function newGift(match,ml){
  const p=GIFTS.find(x=>x.n===0 && x.t.toLowerCase().includes(match.toLowerCase()))||null;
  const cat=CATALOG_PRICING[match]||lookupCatalog(match)||{ml:0,p:0};
  const g={id:uid(),title:p?p.t:(match||""),titleZh:p?p.z:"",sizeMl:ml||5,valueHkd:0,estimated:true,img:p?p.i:null,fullPriceHkd:cat.p||0,fullSizeMl:cat.ml||0,nonMl:false,sizeOpts:p?p.s:null,sku:'',variantId:'',customImg:null,hidden:false};
  const r=giftValueFor(g);g.valueHkd=r.val;g.estimated=r.est;syncGiftSku(g);return g;
}
/* Set a gift's sku + variantId from the selected size (or the non-mL product). */
function syncGiftSku(g){
  if(g.nonMl)return; g.sku='';g.variantId='';
  if(g.sizeOpts&&g.sizeOpts.length){const hit=g.sizeOpts.find(o=>o[0]===g.sizeMl);if(hit){g.sku=hit[2]||'';g.variantId=hit[3]||'';}}
}
/* Resolve a gift's value: real Shopify per-size price if > 0, else the 40% per-mL formula. */
function giftValueFor(g){
  if(g.nonMl)return {val:+g.valueHkd||0,est:false};
  let v=0;if(g.sizeOpts&&g.sizeOpts.length){const hit=g.sizeOpts.find(o=>o[0]===g.sizeMl);if(hit)v=hit[1];}
  if(v>0)return {val:v,est:false};
  return {val:calcVal(g.fullPriceHkd,g.fullSizeMl,g.sizeMl),est:true};
}
/* formula */
function calcVal(fullP,fullMl,sizeMl,premium){premium=premium==null?40:premium;if(!fullP||!fullMl||!sizeMl)return 0;const perMl=fullP/fullMl;return Math.round(perMl*(1+premium/100)*sizeMl/5)*5;}
function normalizeTitle(t){return(t||"").replace(/\[Gift\]/gi,"").replace(/Travel\s*\/\s*Deluxe|Travel\s*Size|Deluxe/gi,"").replace(/\(Sample\)/gi,"").replace(/\(\d+\s*m[lL]\)/gi,"").replace(/\/\s*(TierGift|PointRedemption)/gi,"").replace(/\|.*$/,"").replace(/\s+/g," ").trim();}
function lookupCatalog(title){const n=normalizeTitle(title);if(CATALOG_PRICING[n])return{name:n,...CATALOG_PRICING[n]};for(const k in CATALOG_PRICING){if(n.toLowerCase().includes(k.toLowerCase()))return{name:k,...CATALOG_PRICING[k]};}return null;}

function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* =================== COMMAND CENTER SYNC ===================
   Pushes each saved promotion to the Ms. Chu Command Center dashboard so it
   appears automatically in the Stock Reallocation campaign dropdown.
   The dashboard side builds a matching receiver at CC_SYNC_URL that:
     - accepts a POST with a text/plain JSON body (no CORS pre-flight needed),
     - checks body.token === CC_SYNC_TOKEN,
     - upserts by body.externalId,
     - returns Access-Control-Allow-Origin so we can read success.               */
const CC_SYNC_ENABLED = true;
const CC_SYNC_URL   = "https://mschu-command-center1-production.up.railway.app/api/banner-campaigns/ingest";
const CC_SYNC_TOKEN = "mschu-bg-sync-7Kq2Rd9Xf3";   /* shared secret — must match the dashboard receiver */
function ccExternalId(){
  const base=(state.promoName||'promotion').toString().toLowerCase().trim()
    .replace(/[^\w一-鿿]+/g,'-').replace(/^-+|-+$/g,'');
  return 'bg-'+(base||'promotion');
}
function ccSetStatus(kind,msg){
  const el=document.getElementById('ccSyncStatus'); if(!el)return;
  el.textContent = msg || (kind==='ok'?'✓ Sent to Command Center — it will show in the Stock Reallocation dropdown.'
    : kind==='pending'?'⏳ Sending to Command Center…'
    : '⚠ Not connected to Command Center yet (the dashboard side isn’t live, or you’re offline). Your promotion is still saved.');
  el.style.color = kind==='ok'?'#2E8B57':kind==='pending'?'#666':'#B36B00';
}
async function syncToCommandCenter(opts){
  opts=opts||{};
  if(!CC_SYNC_ENABLED) return {ok:false,skipped:true};
  ccSetStatus('pending');
  const payload={ token:CC_SYNC_TOKEN, source:'banner-generator', version:1,
    externalId:ccExternalId(), name:(state.promoName||'Untitled promotion'),
    theme:state.theme, status:'draft', savedAt:new Date().toISOString(),
    campaign:JSON.parse(JSON.stringify(state)) };
  try{
    const res=await fetch(CC_SYNC_URL,{method:'POST',mode:'cors',
      headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify(payload)});
    if(res.ok){ ccSetStatus('ok'); if(opts.manual)toast('✓ Synced to Command Center'); return {ok:true}; }
    ccSetStatus('err','⚠ Command Center replied '+res.status+'. The dashboard receiver may not be set up yet.');
    if(opts.manual)toast('Command Center replied '+res.status+' — dashboard side not ready yet');
    return {ok:false,status:res.status};
  }catch(e){
    ccSetStatus('err'); if(opts.manual)toast('Couldn’t reach Command Center yet — promotion saved locally');
    return {ok:false,error:(e&&e.message)||'network'};
  }
}

/* =================== STEPPER =================== */
function buildStepper(){
  const s=document.getElementById('stepper');s.innerHTML='';
  STEP_LABELS.forEach((lbl,i)=>{
    const n=i+1;const d=document.createElement('div');
    d.className='stp'+(n===step?' active':'')+(n<step?' done':'');
    d.onclick=()=>{if(n<step||n<=maxReached)go(n);};
    d.innerHTML=`<div class="dot">${n<step?'✓':n}</div><div class="lbl">${lbl}</div>`;
    s.appendChild(d);
    if(i<STEP_LABELS.length-1){const b=document.createElement('div');b.className='conn';s.appendChild(b);}
  });
  document.getElementById('stepOf').textContent=`Step ${step} of 6`;
  document.getElementById('btnBack').style.visibility=step>1?'visible':'hidden';
  document.getElementById('btnNext').style.visibility=step<6?'visible':'hidden';
}
function go(n){if(n<1||n>6)return;step=n;maxReached=Math.max(maxReached,n);buildStepper();renderStep();window.scrollTo({top:0,behavior:'smooth'});}

/* =================== STEP RENDER =================== */
function renderStep(){
  const c=document.getElementById('stepContent');
  c.innerHTML = step===1?stepTheme():step===2?stepTiers():step===3?stepGifts():step===4?stepValues():step===5?stepPreview():stepGenerate();
}

   <div class="hint" style="color:#2E8B57">✓ Every time you hit <b>Save Promotion</b> (Generate step), a permanent <b>JSON backup downloads to your computer</b> automatically. Reload any backup anytime with <b>Import</b> (top of page).</div>
   <div class="hint" style="color:#b06a12">Note: the cards below are stored in <b>this browser only</b> and are size-limited, so older ones may drop — but your downloaded JSON backups never expire.</div>
   <div class="saved" style="margin-top:10px">${saved}</div>

   <div class="hint">Save reusable background images, then click one to apply it.</div>
   ${bgLibBlock('desktop')}${bgLibBlock('mobile')}`;

function bgLibBlock(kind){

function uploadBgLib(ev,kind){const f=ev.target.files[0];if(!f)return;const add=(data)=>{const it={id:uid(),label:f.name,data};bgLib[kind].push(it);lsSet('mschu_bg_'+kind,bgLib[kind]);if(kind==='desktop')state.customBg=data;else state.mobileBg=data;renderStep();toast('Saved to library & applied');};const isPdf=(f.type==='application/pdf')||/\.pdf$/i.test(f.name||'');if(isPdf){toast('Rendering PDF…');pdfToDataUrl(f).then(add).catch(()=>toast('Could not read that PDF'));}else{const r=new FileReader();r.onload=()=>add(r.result);r.readAsDataURL(f);}ev.target.value='';}
function applyBg(kind,id){const b=bgLib[kind].find(x=>x.id===id);if(!b)return;if(kind==='desktop')state.customBg=b.data;else state.mobileBg=b.data;renderStep();toast('Background applied');}

/* ---- STEP 3 ---- */
function stepGifts(){
  let out=`<div class="step-title">Select Gift Products</div><div class="step-desc">Search your synced Shopify gift catalog (74 products). Pick a product, tap a size chip, and the value fills from the real Shopify price (or the 40% formula when the store price is HK$0). The lowest tier is free-shipping only.</div>`;

      <div style="display:flex;align-items:center;justify-content:space-between;background:#e9f6ee;border:1px solid #cfe9d8;border-radius:10px;padding:10px 13px;margin:12px 0"><span style="font-weight:700;color:#2E8B57;font-size:13px">🚚 Free Shipping</span><span style="font-size:12px;color:#3b8a5c">Included in all tiers</span></div>`;
    if(i===0){out+=`<div class="hint" style="font-style:italic;margin:2px 2px 0">Free Shipping only — no product gifts for this tier</div></div>`;return;}
    t.gifts.forEach((g,gi)=>{
      out+=`<div class="gift${g.hidden?' hid':''}" draggable="true" ondragstart="dStart(event,'${t.id}','${g.id}')" ondragend="dEnd(event)" ondragover="event.preventDefault()" ondrop="dDrop(event,'${t.id}','${g.id}')" style="background:#fff;padding:14px 15px;margin:12px 0">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px"><span style="color:var(--muted);cursor:grab;font-size:16px" title="Drag to reorder">⠿</span><span style="font-size:13px;font-weight:700;color:var(--navy)">Gift ${gi+1}</span>${g.title?'':'<span class="warn" style="font-size:12px">⚠ No product selected</span>'}<span style="margin-left:auto;display:flex;gap:6px"><button class="btn-ghost mini" onclick="toggleGift('${t.id}','${g.id}')">${g.hidden?'🚫':'👁'}</button><button class="btn-danger mini" onclick="delGift('${t.id}','${g.id}')">✕</button></span></div>
        <div class="prow"><img src="${g.img||PX}" onerror="this.src='${PX}'"><div class="pi"><div class="n">${escH(g.title||'—')}</div><div class="z">${escH(g.titleZh||(g.title?'⚠ no ZH name':''))}</div></div></div>
        ${(!g.nonMl&&g.sizeOpts&&g.sizeOpts.length)?`<div style="margin-top:11px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="hint" style="margin:0">Sizes:</span>${g.sizeOpts.map(o=>`<button class="mini ${g.sizeMl===o[0]?'btn-primary':'btn-ghost'}" onclick="setGiftSize('${t.id}','${g.id}',${o[0]})">${o[0]}mL${o[1]>0?' · $'+o[1]:''}</button>`).join('')}</div>`:''}
        <div class="row" style="margin-top:11px"><div><label class="f" style="margin:2px 0">Size (mL)</label><input type="number" min="1" max="500" value="${g.sizeMl}" oninput="editGiftSize('${t.id}','${g.id}',this.value)" ${g.nonMl?'disabled':''}></div>

function tierTotal(t){let s=0;t.gifts.filter(g=>!g.hidden).forEach(g=>s+=(+g.valueHkd||0));return s;}
function addGift(tid){state.tiers.find(x=>x.id===tid).gifts.push({id:uid(),title:"",titleZh:"",sizeMl:5,valueHkd:0,estimated:true,img:null,fullPriceHkd:0,fullSizeMl:0,nonMl:false,sizeOpts:null,sku:'',variantId:'',customImg:null,hidden:false});renderStep();}
function delGift(tid,gid){const t=state.tiers.find(x=>x.id===tid);t.gifts=t.gifts.filter(g=>g.id!==gid);renderStep();}
function toggleGift(tid,gid){gget(tid,gid).hidden=!gget(tid,gid).hidden;renderStep();}
function toggleTier(id){const t=state.tiers.find(x=>x.id===id);t.hidden=!t.hidden;renderStep();}
function dupTier(id){const i=state.tiers.findIndex(t=>t.id===id);const c=JSON.parse(JSON.stringify(state.tiers[i]));c.id=uid();
  let inherited=false;
  if(!c.gifts.length){for(let j=i-1;j>=0;j--){if(state.tiers[j].gifts.length){c.gifts=JSON.parse(JSON.stringify(state.tiers[j].gifts));inherited=true;break;}}}
  c.gifts.forEach(g=>g.id=uid());
  /* keep the duplicated tier's amount identical to the source — never auto-change predefined amounts */
  state.tiers.splice(i+1,0,c);renderStep();toast(inherited?'Copied gifts from the tier above':(c.gifts.length?'Tier duplicated with gifts':'Tier duplicated (no gifts to copy)'));}

  else{g.sizeOpts=p.s||[];g.sizeMl=(p.s&&p.s.length)?p.s[0][0]:(g.sizeMl||5);const cat=lookupCatalog(p.t);g.fullPriceHkd=cat?cat.p:0;g.fullSizeMl=cat?cat.ml:0;const r=giftValueFor(g);g.valueHkd=r.val;g.estimated=r.est;syncGiftSku(g);}
  renderStep();}

/* ---- STEP 4 ---- */
function stepValues(){
  let out=`<div class="step-title">Gift Values</div><div class="step-desc">Auto-calculated using the 40% per-mL premium formula from the travel-size pricing skill. Non-mL items (bags, accessories) require manual override.</div>

/* ---- Die-cut: remove the white background around a product photo (edge flood-fill keeps interior whites) ---- */
let _cutBackup=null;
function _loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>rej(new Error('load'));i.src=src;});}
async function _imgForCanvas(src){
  if(src.indexOf('data:')===0) return await _loadImage(src);
  const r=await fetch(src,{mode:'cors'}); if(!r.ok) throw new Error('fetch'); const b=await r.blob();
  const u=URL.createObjectURL(b); try{ const im=await _loadImage(u); im._objurl=u; return im; }catch(e){ URL.revokeObjectURL(u); throw e; }
}
async function cutoutWhiteImg(src){
  const img=await _imgForCanvas(src);
  let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height; const MAX=440;
  if(w>MAX||h>MAX){const s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
  const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);
  if(img._objurl)URL.revokeObjectURL(img._objurl);
  const d=ctx.getImageData(0,0,w,h),px=d.data,N=w*h,thr=238,seen=new Uint8Array(N),st=[];
  const white=i=>px[i]>=thr&&px[i+1]>=thr&&px[i+2]>=thr;
  const seed=p=>{if(!seen[p]&&white(p*4)){seen[p]=1;st.push(p);}};
  for(let x=0;x<w;x++){seed(x);seed((h-1)*w+x);}
  for(let y=0;y<h;y++){seed(y*w);seed(y*w+w-1);}
  while(st.length){const p=st.pop();px[p*4+3]=0;const x=p%w,y=(p/w)|0;
    if(x+1<w)seed(p+1);if(x>0)seed(p-1);if(y+1<h)seed(p+w);if(y>0)seed(p-w);}
  ctx.putImageData(d,0,0);
  return c.toDataURL('image/png');
}

     +`<div style="margin-top:30px;background:#fff;padding:14px 60px;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:5"><h1 style="font-size:48px;font-weight:bold;color:#1B365D;margin:0;font-family:'Georgia',serif;letter-spacing:2px">${STR.spendOver[l]}</h1></div>`
     +`<div style="display:flex;justify-content:center;gap:20px;margin-top:30px;z-index:5;flex-wrap:wrap">${tiers.map(t=>`<div style="background:linear-gradient(135deg,#C41E3A 0%,#8B0000 100%);color:#fff;padding:10px 24px;border-radius:6px;font-size:32px;font-weight:bold;font-family:sans-serif;box-shadow:0 3px 8px rgba(0,0,0,.2);min-width:120px;text-align:center">$${t.amount.toLocaleString()}</div>`).join('')}</div>`
     +`<div style="display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-top:10px;flex:1;padding:0 20px;z-index:5">${tiers.map(t=>{const fg=t.gifts.filter(g=>!g.hidden&&(g.customImg||g.img));const cw=Math.floor((1280-80)/tiers.length);return`<div style="display:flex;align-items:flex-end;justify-content:center;gap:2px;flex:1;max-width:${cw}px">${fg.length?fg.map(g=>imgTag(gimg(g),'height:160px;width:auto;max-width:120px;object-fit:contain')).join(''):`<div style="display:flex;flex-direction:column;align-items:center"><div style="font-size:64px;line-height:1">🚚</div><div style="font-size:20px;font-weight:bold;color:#2E8B57;font-family:sans-serif">${STR.ship[l]}</div></div>`}</div>`;}).join('')}</div>`
     +`<div style="display:flex;justify-content:center;gap:16px;padding:0 40px;margin-top:8px;width:100%;z-index:5">${tiers.map(t=>{const tv=giftTotal(t);const cw=Math.floor((1280-80)/tiers.length);return`<div style="flex:1;max-width:${cw}px;text-align:center;font-size:26px;font-weight:bold;color:#1B365D;font-family:sans-serif">${tv>0?('$'+tv.toLocaleString()+' '+STR.valueH[l]):STR.ship[l]}</div>`;}).join('')}</div>`
     +`<div style="margin-top:20px;margin-bottom:30px;background:#fff;padding:14px 60px;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:5"><p style="font-size:36px;font-weight:bold;color:#C41E3A;margin:0;font-style:italic;font-family:${isZh?'"Noto Sans TC",sans-serif':'"Georgia",serif'}">${STR.cta[l]}</p></div>`;
    return{el,W,H};
  }
  let header=`<div style="${f==='mobile'?'':'height:220px;'}display:flex;flex-direction:column;align-items:center;justify-content:center;padding:${f==='mobile'?'40px 30px 24px':'30px 60px 20px'};position:relative;flex-shrink:0">`
    +badgeOrSeasonal(f==='mobile'?28:25,f==='mobile'?28:40,f==='mobile'?150:160,f==='mobile'?'10px 14px':'10px 18px',f==='mobile'?20:18)
    +`<div style="position:absolute;top:${f==='mobile'?20:18}px;right:${f==='mobile'?24:35}px;width:${f==='mobile'?140:160}px;height:${f==='mobile'?140:160}px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1)"><img src="${logoUrl()}" crossorigin="anonymous" style="width:${f==='mobile'?130:148}px;height:${f==='mobile'?130:148}px;object-fit:contain;border-radius:50%"></div>`
    +`<div style="font-size:${f==='mobile'?50:52}px;font-weight:bold;color:#1B365D;margin:${f==='mobile'?'60px 0 8px 0':'0 0 8px 0'};text-align:center;letter-spacing:-.5px">${STR.header[l]}</div>`
    +`<p style="font-size:${f==='mobile'?22:24}px;color:#666;font-style:italic;margin:0;text-align:center">${STR.sub[l]}</p></div>`;
  let body='';
  if(f!=='mobile'){
    body=`<div style="flex:1;display:flex;flex-direction:column;padding:0 50px">`+tiers.map(t=>{const fg=filledGifts(t),tv=giftTotal(t);const prod=fg.map(g=>`<div style="display:flex;align-items:center;gap:10px"><div style="font-size:26px;font-weight:bold;color:#1B365D;font-family:sans-serif;flex-shrink:0">+</div>${imgTag(gimg(g),'width:130px;height:130px;object-fit:contain;flex-shrink:0')}<div style="font-size:14px;color:#333;font-family:sans-serif;line-height:1.3;max-width:140px;font-weight:500">${escH(isZh?(g.titleZh||g.title):g.title)}${g.sizeMl?` ${g.sizeMl}mL`:''}</div></div>`).join('');
      return`<div style="flex:1;display:flex;align-items:center;border-top:1px solid rgba(212,175,55,.3);padding:8px 0"><div style="width:220px;flex-shrink:0;padding-right:20px;border-right:2px solid rgba(212,175,55,.4)"><div style="font-size:44px;font-weight:bold;color:#1B365D;font-family:sans-serif;line-height:1.1">HKD ${t.amount.toLocaleString()}</div><div style="font-size:18px;color:#1B365D;font-family:sans-serif;font-weight:500;margin-top:2px">${STR.inOrder[l]}</div></div><div style="width:110px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-left:14px"><div style="font-size:42px;line-height:1">🚚</div><div style="font-size:15px;color:#2E8B57;font-weight:bold;font-family:sans-serif;line-height:1.2;text-align:center;margin-top:2px">${STR.ship[l]}</div></div><div style="flex:1;display:flex;align-items:center;gap:12px;padding-left:16px;overflow:hidden">${prod}</div><div style="width:220px;flex-shrink:0;text-align:right;padding-left:10px">${tv>0?`<div style="font-size:20px;color:#1B365D;font-family:sans-serif;font-weight:500;line-height:1.2">${STR.valueD[l]}</div><div style="font-size:36px;font-weight:bold;color:#1B365D;font-family:sans-serif;line-height:1.1">HKD ${tv.toLocaleString()}</div>`:`<div style="font-size:32px;color:#2E8B57;font-family:sans-serif;font-weight:bold">✓</div>`}</div></div>`;}).join('')+`</div>`;
  }else{
    body=`<div style="flex:1;display:flex;flex-direction:column;padding:0 24px;justify-content:space-evenly">`+tiers.map((t,idx)=>{const fg=filledGifts(t),tv=giftTotal(t),gc=fg.length,imgSize=gc<=2?120:gc<=4?100:80,nameF=gc<=3?16:14;const cells=fg.map(g=>`<div style="display:flex;flex-direction:column;align-items:center">${imgTag(gimg(g),`width:${imgSize}px;height:${imgSize}px;object-fit:contain;flex-shrink:0`)}<div style="font-size:${nameF}px;color:#333;font-family:sans-serif;line-height:1.2;text-align:center;margin-top:4px;max-width:${imgSize+20}px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${escH(isZh?(g.titleZh||g.title):g.title)}${g.sizeMl?` ${g.sizeMl}mL`:''}</div></div>`).join('');
      return`<div style="display:flex;align-items:center;padding:20px 0;gap:12px;position:relative;${idx<tiers.length-1?'border-bottom:1.5px solid rgba(200,200,200,.5)':''}"><div style="flex-shrink:0;min-width:110px"><div style="font-size:18px;color:#1B365D;font-family:sans-serif;font-weight:500;line-height:1.3">HKD</div><div style="font-size:52px;font-weight:bold;color:#1B365D;font-family:sans-serif;line-height:1">${t.amount.toLocaleString()}</div><div style="font-size:16px;color:#1B365D;font-family:sans-serif;margin-top:2px">${STR.inOrder[l]}</div></div><div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:80px"><div style="font-size:36px;line-height:1">🚚</div><div style="font-size:14px;color:#2E8B57;font-weight:bold;font-family:sans-serif;margin-top:4px;text-align:center">${STR.ship[l]}</div></div>${gc>0?`<div style="font-size:28px;font-weight:bold;color:#1B365D;font-family:sans-serif;flex-shrink:0">+</div>`:''}<div style="flex:1;display:grid;grid-template-columns:${gc<=1?'1fr':'repeat(2,1fr)'};gap:8px;align-content:center;justify-items:center">${cells}</div><div style="flex-shrink:0;text-align:right;min-width:110px">${tv>0?`<div style="font-size:18px;color:#1B365D;font-family:sans-serif;font-weight:500;line-height:1.2">${STR.valueM[l]}</div><div style="font-size:32px;font-weight:bold;color:#1B365D;font-family:sans-serif;line-height:1.1">HKD ${tv.toLocaleString()}</div>`:`<div style="font-size:22px;font-weight:bold;color:#2E8B57;font-family:sans-serif">= ${STR.ship[l]}</div>`}</div></div>`;}).join('')+`</div>`;
  }
  const foot=`<div style="height:${f==='mobile'?70:80}px;background:#1B365D;display:flex;align-items:center;justify-content:center;padding:0 ${f==='mobile'?30:40}px;flex-shrink:0;${f==='mobile'?'margin-top:8px':''}"><p style="color:#fff;font-size:${f==='mobile'?13:14}px;text-align:center;margin:0;font-family:sans-serif;line-height:1.4">${STR.disc[l]}</p></div>`;
  const scrimOp=(state.scrimOpacity!=null?state.scrimOpacity:0.9);
  const scrim=(state.centerScrim&&bg)?`<div style="position:absolute;inset:${f==='mobile'?'6% 6%':'9% 5%'};background:rgba(255,255,255,${scrimOp});border-radius:28px;z-index:0;box-shadow:0 8px 44px rgba(0,0,0,.07)"></div>`:'';
  el.innerHTML=(bg?'':botanical())+`<div style="position:absolute;top:12px;left:12px;right:12px;bottom:12px;border:2px solid rgba(212,175,55,.4);border-radius:4px;pointer-events:none;z-index:3"></div>`+scrim+`<div style="position:relative;z-index:1;display:flex;flex-direction:column;flex:1;min-height:0">`+header+body+foot+`</div>`;
  return{el,W,H};
}

/* =================== PREVIEW DIALOG =================== */
function openDialog(){document.getElementById('overlay').classList.add('open');dRender();}
function closeDialog(){document.getElementById('overlay').classList.remove('open');}
function dSetFmt(f){dFmt=f;document.querySelectorAll('#dFmt button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));dRender();}
function dSetLang(l){dLang=l;document.querySelectorAll('#dLang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));dRender();}
function dRender(){const host=document.getElementById('dHost');host.innerHTML='';const{el,W,H}=buildBanner(dFmt,dLang);host.appendChild(el);const availW=Math.min(window.innerWidth*0.9,1200),availH=window.innerHeight*0.75;const scale=Math.min(1,availW/W,availH/H);const sc=document.getElementById('dScaler');sc.style.transform=`scale(${scale})`;sc.style.width=W+'px';sc.style.height=(H*scale)+'px';}
async function dExport(){toast('Rendering '+dFmt+'…');try{const{url,ext}=await rasterize(dFmt,dLang);dl(url,`promotion-${dFmt}-${dLang}.${ext}`);toast('Downloaded');}catch(e){toast('Export blocked by a cross-origin image');}}
function setScrimOpacity(v){state.scrimOpacity=Math.max(0,Math.min(1,(+v)/100));const p=document.getElementById('scrimPct');if(p)p.textContent=Math.round(state.scrimOpacity*100)+'% white';const ov=document.getElementById('overlay');if(ov&&ov.classList.contains('open'))dRender();}

/* =================== EXPORT =================== */
async function rasterize(f,l){const{el,W,H}=buildBanner(f,l);const holder=document.createElement('div');holder.style.cssText='position:fixed;left:0;top:0;opacity:0;pointer-events:none;z-index:-1';holder.appendChild(el);document.body.appendChild(holder);await new Promise(r=>setTimeout(r,350));const pr=f==='hero'?1:2;const opt={pixelRatio:pr,cacheBust:true,quality:f==='hero'?0.82:0.95,width:W,height:H,style:{transform:'none'}};let url;try{url=f==='hero'?await htmlToImage.toJpeg(el,opt):await htmlToImage.toPng(el,opt);}catch(e){document.body.removeChild(holder);throw e;}document.body.removeChild(holder);return{url,ext:f==='hero'?'jpg':'png'};}
function dl(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click();}
async function generateAll(){
  const g=document.getElementById('genGallery');g.innerHTML='<div class="hint" style="margin-top:14px">Rendering 6 variants…</div>';
  const combos=[['desktop','en'],['desktop','zh'],['mobile','en'],['mobile','zh'],['hero','en'],['hero','zh']];
  const gal=document.createElement('div');gal.className='gallery';let ok=0;
  for(const[f,l] of combos){try{const{url,ext}=await rasterize(f,l);const c=document.createElement('div');c.className='gcard';c.innerHTML=`<img src="${url}" onclick="window.open('${url}')"><div class="cap"><span class="t">${f} · ${l.toUpperCase()}</span><button class="btn-ghost mini" onclick="dl('${url}','promotion-${f}-${l}.${ext}')">⬇︎</button></div>`;gal.appendChild(c);ok++;}catch(e){console.error(f,l,e);}}
  g.innerHTML='';g.appendChild(gal);
  const note=document.createElement('div');note.className='hint';note.style.marginTop='10px';note.textContent=ok===6?'All 6 rendered. Click a thumbnail to open full-size, or ⬇︎ to download.':`Rendered ${ok}/6 (some blocked by cross-origin images — in your browser Shopify images load normally).`;g.appendChild(note);
}

/* =================== SAVED PROMOTIONS =================== */
function stamp(){try{return new Date().toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return new Date().toLocaleString();}}
function savePromo(){
  const name=state.promoName||('Promotion '+stamp());
  const rec={id:uid(),name,theme:state.theme,date:stamp(),state:JSON.parse(JSON.stringify(state))};
  savedPromos.unshift(rec); savedPromos=savedPromos.slice(0,12);
  const trySave=()=>{try{localStorage.setItem('mschu_promos',JSON.stringify(savedPromos));return true;}catch(e){return false;}};
  let ok=trySave(), dropped=0;
  while(!ok && savedPromos.length>1){savedPromos.pop();dropped++;ok=trySave();}   // free space by dropping oldest
  renderStep();
  // always download a permanent JSON backup so nothing is ever lost
  let dl_ok=true;
  try{ dl('data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(rec.state,null,2)), (name.replace(/[^\w一-龥-]+/g,'_')||'promotion')+'_'+stamp().replace(/[^\dA-Za-z]+/g,'-')+'.json'); }catch(e){ dl_ok=false; }
  const bk=dl_ok?' — a JSON backup was downloaded to your computer.':'';
  if(ok && !dropped) toast('Promotion saved'+bk);
  else if(ok && dropped) toast('Saved ('+dropped+' oldest browser-save(s) removed to free space)'+bk);
  else toast('⚠ Browser storage full — kept only the downloaded JSON backup. Re-load it anytime with Import.'+ (dl_ok?'':' Backup download was blocked — use Export JSON.'));
  try{ syncToCommandCenter({manual:false}); }catch(e){}   // auto-push to Command Center dashboard (non-blocking)
}
function exportPromo(id){const r=savedPromos.find(p=>p.id===id);if(!r)return;dl('data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(r.state,null,2)),(r.name||'promotion').replace(/[^\w一-龥-]+/g,'_')+'.json');toast('Downloaded a permanent copy');}
function loadPromo(id){const r=savedPromos.find(p=>p.id===id);if(!r)return;state=JSON.parse(JSON.stringify(r.state));if(!state.logo&&savedLogo)state.logo=savedLogo;renderStep();toast('Promotion loaded');}
function delPromo(id){savedPromos=savedPromos.filter(p=>p.id!==id);lsSet('mschu_promos',savedPromos);renderStep();}

/* =================== JSON IMPORT/EXPORT =================== */
function saveJSON(){const d=JSON.stringify(state,null,2);dl('data:application/json;charset=utf-8,'+encodeURIComponent(d),(state.promoName||'promotion').replace(/[^\w一-龥-]+/g,'_')+'.json');toast('Exported JSON');}
function loadJSON(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);renderStep();toast('Imported');}catch(e){toast('Invalid file');}};r.readAsText(f);ev.target.value='';}

/* =================== HELPERS =================== */
function escH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escA(s){return(s||'').replace(/"/g,'&quot;');}
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2600);}
window.addEventListener('resize',()=>{if(document.getElementById('overlay').classList.contains('open'))dRender();});

/* =================== BOOT =================== */
buildStepper();renderStep();
</script>
